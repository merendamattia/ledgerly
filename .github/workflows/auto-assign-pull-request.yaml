name: 'Auto Assign Pull Request'
on:
  pull_request_target:
    types: [opened, ready_for_review]

# The action reads its config through the Contents API, requests reviewers through
# Pull Requests, and sets assignees through Issues.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  add-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: kentaro-m/auto-assign-action@v2.0.0
        with:
          configuration-path: '.github/configs/auto-assign-pull-request-configs.yaml'
