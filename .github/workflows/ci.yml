name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests + build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgerly
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-32
      BETTER_AUTH_URL: http://localhost:3001
      ADMIN_EMAIL: admin@ledgerly.local
      ADMIN_PASSWORD: changeme123
      CRON_SECRET: ci-cron-secret
      FRONTEND_URL: http://localhost:3000
      PORT: "3001"

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: src/backend
        run: bunx prisma generate
      - name: Apply migrations
        working-directory: src/backend
        run: bunx prisma migrate deploy
      - name: Typecheck
        working-directory: src/backend
        run: bunx tsc --noEmit
      - name: Test
        working-directory: src/backend
        run: bun test
      - name: Build
        working-directory: src/backend
        run: bun run build

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The frontend's typed RPC import needs the backend's generated Prisma types.
      - name: Generate Prisma client
        working-directory: src/backend
        run: bunx prisma generate
      - name: Lint
        working-directory: src/frontend
        run: bun run lint
      - name: Test
        working-directory: src/frontend
        run: bun test
      - name: Build
        working-directory: src/frontend
        run: bun run build
