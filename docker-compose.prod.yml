# Production compose for Coolify. Backend, worker, and frontend.
# Postgres and Redis are managed Coolify resources: set DATABASE_URL / REDIS_URL
# in the Coolify env. The nightly job runs IN-PROCESS in the backend (croner),
# so there is no scheduled task to configure on Coolify.
services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}          # public backend URL (https)
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CRON_SECRET: ${CRON_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}                # public frontend URL (CORS)
      APP_ENV: ${APP_ENV:-production}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      PORT: 3001
      # CRON_SCHEDULE is legacy/unused; per-job schedules are seeded in cron_job.
      CRON_ENABLED: ${CRON_ENABLED:-true}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 2 * * *}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Europe/Rome}
    expose:
      - "3001"

  worker:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    command: ["sh", "-c", "bunx prisma migrate deploy && bun run start:worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CRON_SECRET: ${CRON_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      APPLE_PAY_WORKER_CONCURRENCY: ${APPLE_PAY_WORKER_CONCURRENCY:-1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      args:
        # Baked into the browser bundle at build time -> public backend URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APPLE_PAY_SHORTCUT_URL: ${NEXT_PUBLIC_APPLE_PAY_SHORTCUT_URL:-https://www.icloud.com/shortcuts/482dbff891ee48098294df6ac773702f}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    expose:
      - "3000"
